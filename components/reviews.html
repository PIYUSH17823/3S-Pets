<section id="reviews" class="px-6 py-16 md:py-32 bg-white relative overflow-hidden">
    <div class="max-w-7xl mx-auto">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-end mb-12 md:mb-20 gap-6">
            <div class="space-y-2 md:space-y-4">
                <span class="text-[#E63946] font-bold tracking-widest uppercase text-xs md:text-sm">Community Voices</span>
                <h2 class="text-4xl md:text-7xl font-bold tracking-tighter text-[#1D1D1F]">Happy Tails.</h2>
            </div>
            
            <div class="flex items-center gap-4">
                <button onclick="openReviewModal()" class="hidden md:block bg-[#1D1D1F] text-white px-6 py-3 rounded-2xl font-bold hover:bg-[#E63946] transition-all text-sm">Write a Review</button>

                    <span class="text-[10px] text-gray-400 block uppercase tracking-tighter font-bold">Avg. User Rating</span>
                </div>
            </div>
        </div>

        <div id="review-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 md:gap-10 items-start">
            </div>
