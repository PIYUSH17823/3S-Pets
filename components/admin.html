<section id="admin-portal" class="fixed inset-0 z-[300] hidden items-center justify-center px-6">
    <div class="absolute inset-0 bg-[#1D1D1F]/90 backdrop-blur-2xl"></div>
    
    <div class="relative bg-white w-full max-w-4xl max-h-[85vh] rounded-[40px] shadow-2xl overflow-hidden flex flex-col">
        <!-- Header -->
        <div class="p-8 md:p-10 border-b border-gray-100 flex justify-between items-center bg-gray-50/50">
            <div>
                <h2 class="text-3xl font-bold tracking-tighter">3S Admin Portal</h2>
                <p class="text-[#E63946] font-bold text-[10px] tracking-[0.2em] uppercase">Review & Lead Management</p>
            </div>
            <button onclick="closeAdminPortal()" class="w-12 h-12 rounded-full bg-gray-100 flex items-center justify-center text-xl hover:bg-[#E63946] hover:text-white transition-all">✕</button>
        </div>

        <!-- content -->
        <div id="admin-content" class="flex-1 overflow-y-auto p-8 md:p-10">
            <!-- Login State -->
            <div id="admin-login" class="max-w-sm mx-auto py-20 space-y-6">
                <div class="text-center space-y-2">
                    <div class="text-4xl">🔐</div>
                    <h3 class="text-xl font-bold">Secure Access</h3>
                    <p class="text-gray-400 text-sm">Enter your admin password to manage the portal.</p>
                </div>
                <input type="password" id="admin-pass-input" placeholder="••••••••" class="w-full bg-gray-100 border-none rounded-2xl px-6 py-4 outline-none focus:ring-2 focus:ring-[#E63946] transition-all text-center tracking-widest">
                <button onclick="loginAdmin()" class="w-full bg-[#1D1D1F] text-white py-4 rounded-2xl font-bold hover:bg-[#E63946] transition-all">Unlock Portal</button>
            </div>

            <!-- Dashboard State (Hidden) -->
            <div id="admin-dashboard" class="hidden space-y-10">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="p-8 bg-gray-50 rounded-[30px] border border-gray-100">
                        <span class="text-[10px] uppercase font-bold text-gray-400 tracking-widest">Pending Reviews</span>
                        <div id="pending-count" class="text-5xl font-bold mt-2">0</div>
                    </div>
                    <div class="p-8 bg-gray-50 rounded-[30px] border border-gray-100">
                        <span class="text-[10px] uppercase font-bold text-gray-400 tracking-widest">Status</span>
                        <div class="text-green-500 font-bold mt-2 flex items-center gap-2">
                            <span class="w-3 h-3 bg-green-500 rounded-full animate-pulse"></span> Authorized
                        </div>
                    </div>
                </div>

                <div class="space-y-6">
                    <h3 class="text-xl font-bold flex items-center gap-2">📝 Review Queue</h3>
                    <div id="review-queue" class="space-y-4">
                        <!-- Reviews generated here -->
                    </div>
                </div>

                <div class="pt-10 border-t border-gray-100 space-y-6">
                    <h3 class="text-xl font-bold flex items-center gap-2">📣 Broadcast Update</h3>
                    <p class="text-gray-400 text-sm">Send a direct email update to all community members and customers.</p>
                    
                    <div class="space-y-4 bg-gray-50 p-8 rounded-[30px] border border-gray-100">
                        <input type="text" id="broadcast-subject" placeholder="Email Subject (e.g., New Pet Wellness Tips!)" class="w-full bg-white border border-gray-200 rounded-2xl px-6 py-4 outline-none focus:ring-2 focus:ring-[#E63946] transition-all">
                        <textarea id="broadcast-message" rows="5" placeholder="Write your message here..." class="w-full bg-white border border-gray-200 rounded-2xl px-6 py-4 outline-none focus:ring-2 focus:ring-[#E63946] transition-all resize-none"></textarea>
                        <button onclick="sendBroadcast()" id="broadcast-btn" class="bg-[#1D1D1F] text-white px-10 py-4 rounded-2xl font-bold hover:bg-[#E63946] transition-all flex items-center gap-2">
                            🚀 Send Broadcast
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
