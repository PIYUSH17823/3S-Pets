<section id="contact" class="px-4 md:px-6 py-16 md:py-24 bg-[#1D1D1F] text-white rounded-t-[50px] md:rounded-t-[80px] -mt-20 relative z-20">
    <div class="max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-12 md:gap-20">
        
        <div class="space-y-8 md:space-y-12">
            <div class="space-y-4">
                <h2 class="text-4xl md:text-6xl font-bold tracking-tighter">
                    Let's talk <br><span class="text-gray-500">Pet Wellness.</span>
                </h2>
                <p class="text-lg md:text-xl text-gray-400 max-w-sm">
                    Have a question about our formulas or your order? Our specialists are here to help.
                </p>
            </div>

            <div class="space-y-6 md:space-y-8 pt-4 md:pt-10">
                <div class="flex items-start gap-4 md:gap-6">
                    <div class="text-2xl md:text-3xl">📍</div>
                    <div>
                        <h4 class="font-bold text-base md:text-lg">Visit the Lab</h4>
                        <p class="text-gray-400 text-sm md:text-base">Pune, Maharashtra <br>Sinhgad Institutes Area</p>
                    </div>
                </div>
                <div class="flex items-start gap-4 md:gap-6">
                    <div class="text-2xl md:text-3xl">📧</div>
                    <div>
                        <h4 class="font-bold text-base md:text-lg">Direct Email</h4>
                        <p class="text-gray-400 text-sm md:text-base">hello@3spets.com</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="bg-white/5 backdrop-blur-xl p-6 md:p-14 rounded-[30px] md:rounded-[40px] border border-white/10">
            <form id="contact-form" class="space-y-6 md:space-y-8">
                <div class="space-y-2">
                    <label class="text-[10px] md:text-xs uppercase font-bold tracking-widest text-gray-500">Full Name</label>
                    <input type="text" placeholder="John Doe" id="name-input" class="contact-input w-full bg-transparent border-b border-white/20 py-2 outline-none focus:border-[#E63946] transition-all">
                </div>
                
                <div class="space-y-2">
                    <label class="text-[10px] md:text-xs uppercase font-bold tracking-widest text-gray-500">Pet's Name & Breed</label>
                    <input type="text" id="pet-input" placeholder="Luna, Golden Retriever" class="contact-input w-full bg-transparent border-b border-white/20 py-2 outline-none focus:border-[#E63946] transition-all">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 md:gap-8">
                    <div class="space-y-2">
                        <label class="text-[10px] md:text-xs uppercase font-bold tracking-widest text-gray-500">Email Address</label>
                        <input type="email" id="email-input" placeholder="john@example.com" class="contact-input w-full bg-transparent border-b border-white/20 py-2 outline-none focus:border-[#E63946] transition-all">
                    </div>
                    <div class="space-y-2">
                        <label class="text-[10px] md:text-xs uppercase font-bold tracking-widest text-gray-500">Whatsapp No.</label>
                        <input type="tel" id="phone-input" placeholder="+91 98765 43210" class="contact-input w-full bg-transparent border-b border-white/20 py-2 outline-none focus:border-[#E63946] transition-all">
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="text-[10px] md:text-xs uppercase font-bold tracking-widest text-gray-500">How can we help?</label>
                    <textarea id="message-input" rows="3" md:rows="4" placeholder="Your message..." class="contact-input w-full bg-transparent border-b border-white/20 py-2 outline-none focus:border-[#E63946] transition-all resize-none"></textarea>
                </div>

                <button type="submit" class="w-full bg-[#E63946] text-white py-4 md:py-5 rounded-xl md:rounded-2xl font-bold text-base md:text-lg hover:bg-white hover:text-[#1D1D1F] transition-all transform hover:scale-[1.02] shadow-2xl">
                    Send Inquiry
                </button>
            </form>
        </div>
    </div>
</section>
