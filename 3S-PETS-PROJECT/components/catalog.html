<section id="products" class="px-4 md:px-6 py-16 md:py-24 bg-white rounded-t-[60px] md:rounded-t-[80px] relative overflow-hidden">
    <div class="max-w-7xl mx-auto">

        <div class="flex flex-col md:flex-row md:items-end justify-between mb-12 md:mb-16 gap-6">
            <div class="space-y-2 text-center md:text-left">
                <h2 class="text-4xl md:text-7xl font-bold tracking-tighter text-[#1D1D1F]">The 3S Collection.</h2>
                <p class="text-lg md:text-xl text-gray-400 font-medium">Engineered for the modern pet home.</p>
            </div>

            <div class="flex p-1 bg-gray-100 rounded-2xl overflow-x-auto no-scrollbar mx-auto md:mx-0">
                <button onclick="changeCategory('Shampoo')" class="cat-tab active whitespace-nowrap">Shampoo</button>
                <button onclick="changeCategory('Biscuits')" class="cat-tab whitespace-nowrap">Biscuits</button>
                <button onclick="changeCategory('Cat Litter')" class="cat-tab whitespace-nowrap">Litter</button>
            </div>
        </div>

        <div class="relative min-h-[500px] md:min-h-[600px] flex items-center justify-center">

            <div id="stage-glow"

            </div>

            <button onclick="prevProduct()" class="stage-nav absolute left-0 md:-left-8 z-30">❮</button>
            <button onclick="nextProduct()" class="stage-nav absolute right-0 md:-right-8 z-30">❯</button>

            <div class="grid grid-cols-1 md:grid-cols-12 w-full gap-8 md:gap-12 items-center z-10">

                <div class="md:col-span-7 flex justify-center relative">
                    <div id="product-icon"
                        class="text-[9rem] md:text-[18rem] select-none filter drop-shadow-2xl animate-float">
                        🧼
                    </div>
                </div>

                <div class="md:col-span-5 space-y-6 md:space-y-8 text-center md:text-left">
                    <div>
                        <span id="product-tag"
                            class="text-[#E63946] font-bold tracking-widest uppercase text-xs md:text-sm">Organic Formula</span>
                        <h3 id="product-title" class="text-4xl md:text-6xl font-bold mt-2 leading-tight">Silk-Finish Shampoo</h3>
                    </div>

                    <p id="product-desc" class="text-base md:text-lg text-gray-500 leading-relaxed max-w-md mx-auto md:mx-0">
                        Our pH-balanced formula uses cold-pressed aloe and organic neem to provide a deep,
                        non-irritating cleanse.
                    </p>

                    <div class="grid grid-cols-2 gap-4 md:gap-6 py-6 md:py-8 border-y border-gray-100">
                        <div>
                            <span class="block text-[10px] md:text-xs uppercase text-gray-400 font-bold mb-1">Standard</span>
                            <span class="text-base md:text-lg font-bold">Lab Tested</span>
                        </div>
                        <div>
                            <span class="block text-[10px] md:text-xs uppercase text-gray-400 font-bold mb-1">Origin</span>
                            <span class="text-base md:text-lg font-bold">Cruelty Free</span>
                        </div>
                    </div>

                    <button onclick="openTechSheet()"
                        class="w-full md:w-auto bg-[#1D1D1F] text-white px-8 md:px-10 py-4 rounded-full font-bold hover:bg-[#E63946] transition-all transform hover:scale-105 shadow-xl">
                        Explore Technical Details
                    </button>
                </div>
            </div>
        </div>
    </div>
